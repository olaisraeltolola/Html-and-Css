<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  

  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 
</head>
<body>
	<section class="outer-container">
		<section class="inner-container">
			<section class="score-container">
				<header class="result">Your Result</header><br>
				<div class="circle">
					<div class="score">
						<div class="big-score">76</div>
						<div class="total">of 100</div>
					</div>
				</div>
				<div class="great">Great</div><br>
				<footer class="bottom-text">You scored higher than 65% of<br>the people who have taken<br>these tests.</footer>
			</section>

			<section class="summary-container">

				<header class="summary">Summary</header>

				<div class="reaction-container">
					<div class="reaction">Reaction</div>
					<div class="eighty-score">
						<div class="eighty">80</div>
						<div class="over-100">/ 100</div>
					</div>
				</div>

				<div class="memory-container">
					<div class="memory">Memory</div>
					<div class="ninety-two-score">
						<div class="ninety-two">92</div>
						<div class="over-100">/ 100</div>
					</div>
				</div>

				<div class="verbal-container">
					<div class="verbal">Verbal</div>
					<div class="sixty-one-score">
						<div class="sixty-one">61</div>
						<div class="over-100">/ 100</div>
					</div>
				</div>

				<div class="visual-container">
					<div class="visual">Visual</div>
					<div class="seventy-three-score">
						<div class="seventy-three">73</div>
						<div class="over-100">/ 100</div>
					</div>
				</div>
				<div class="continue-container">
					<div class="continue">Continue</div>
				</div>
			</section>
		</section>
	</section>
  
</body>
</html>
